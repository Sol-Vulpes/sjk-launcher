name: Build

# Every push and pull request is tested and built on the three OSes.
# A release is made when a v* tag is pushed, or by hand from the Actions tab
# ("Run workflow" with a version). The version must match Cargo.toml.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.0 (must match Cargo.toml)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux tray and window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test, build and pack
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Test, build and pack
        if: runner.os != 'Windows'
        run: sh build.sh --test
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        id: version
        env:
          WANTED: ${{ inputs.version || github.ref_name }}
        run: |
          wanted="${WANTED#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sjk-launcher") | .version')
          if [ "$wanted" != "$crate" ]; then
            echo "::error::Releasing $wanted but Cargo.toml says $crate"
            exit 1
          fi
          echo "tag=v$crate" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "SJK Launcher $TAG" --generate-notes $pre
