name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: sjk-launcher.exe
            archive: sjk-launcher-windows-x64.zip
          - os: ubuntu-latest
            binary: sjk-launcher
            archive: sjk-launcher-linux-x64.tar.gz
          - os: macos-latest
            binary: sjk-launcher
            archive: sjk-launcher-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux tray and window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          cd target/release
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "../../${{ matrix.archive }}" "${{ matrix.binary }}"; else tar -czf "../../${{ matrix.archive }}" "${{ matrix.binary }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${{ github.ref_name }}" --title "SJK Launcher ${{ github.ref_name }}" --generate-notes 2>/dev/null; gh release upload "${{ github.ref_name }}" "${{ matrix.archive }}" --clobber
