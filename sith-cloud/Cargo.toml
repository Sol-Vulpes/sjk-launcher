[package]
name = "sith-cloud"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Serves a folder of PK3s as a JoF-style content repository"

[dependencies]
tiny_http = "0.12"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sjk-jof-content = { git = "https://github.com/Sol-Vulpes/SJK", tag = "sjk-v2026.1027.1" }
